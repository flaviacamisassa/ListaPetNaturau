// ── HISTÓRICO ─────────────────────────────────────────────
const MES_NOMES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function mesAnoLabel(dateStr){
  const [y,m]=dateStr.split('-');
  return `${MES_NOMES[parseInt(m)-1]} de ${y}`;
}
function mesAnoKey(dateStr){
  const [y,m]=dateStr.split('-');
  return `${y}-${m}`;
}

function renderHistorico(){
  const history=state.db.history||[];
  const petHistory=state.db.petiscosHistory||[];
  if(!state.openHistMonths) state.openHistMonths={};
  if(!state.openPetHistMonths) state.openPetHistMonths={};

  let html=`<div class="card-title" style="margin-bottom:14px;font-family:'Coolvetica','DM Sans',sans-serif;font-size:18px">Histórico de Produções</div>`;

  // ── SEÇÃO 1: RECEITAS — agrupado por mês, recolhível ──
  html+=`<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--green-dark);margin-bottom:8px"><i class="fas fa-clipboard-list"></i> Produção de Receitas</div>`;
  if(!history.length){
    html+=`<div class="empty"><i class="fas fa-history"></i><p>Nenhuma produção registrada ainda.</p></div>`;
  } else {
    const byMonth={};
    history.forEach(h=>{
      const mk=mesAnoKey(h.date);
      if(!byMonth[mk]) byMonth[mk]=[];
      byMonth[mk].push(h);
    });
    const monthKeys=Object.keys(byMonth).sort((a,b)=>b.localeCompare(a));
    monthKeys.forEach(mk=>{
      const entries=byMonth[mk].sort((a,b)=>b.date.localeCompare(a.date));
      const isOpen=state.openHistMonths[mk]!==undefined?state.openHistMonths[mk]:(mk===monthKeys[0]);
      const totalMes=entries.reduce((a,h)=>a+parseFloat(h.totalKg||0),0);
      html+=`<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden">
        <div onclick="toggleHistMonth('${mk}')" style="display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;background:${isOpen?'var(--green-light)':'var(--card)'}">
          <div style="display:flex;align-items:center;gap:8px">
            <i class="fas fa-calendar-alt" style="color:var(--green-dark);font-size:13px"></i>
            <span style="font-weight:700;font-size:13px">${mesAnoLabel(entries[0].date)}</span>
            <span class="badge badge-gray" style="font-size:10px">${entries.length} dia${entries.length!==1?'s':''}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:12px;font-weight:700;color:var(--green-dark);font-family:'DM Mono',monospace">${totalMes.toFixed(2)} kg</span>
            <i class="fas fa-chevron-${isOpen?'up':'down'}" style="color:var(--green-dark);font-size:11px"></i>
          </div>
        </div>
        ${isOpen?`<div style="padding:6px 10px 10px">`+entries.map(h=>`<div class="history-item" style="margin-bottom:6px">
          <div onclick="viewHistDetail('${h.id}')" style="flex:1;cursor:pointer">
            <div class="hi-date">${h.dateStr||h.date}</div>
            <div class="hi-meta">${(h.recipes||[]).slice(0,3).join(' · ')}${(h.recipes||[]).length>3?` +${h.recipes.length-3}`:''}</div>
          </div>
          <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px">
            <div class="hi-kg">${h.totalKg} kg</div>
            <div style="display:flex;gap:5px">
              <button class="btn btn-sm" style="font-size:11px;padding:3px 8px" onclick="editHistEntry('${h.id}');event.stopPropagation()">
                <i class="fas fa-edit"></i> Editar
              </button>
              <button class="btn btn-sm btn-danger" style="font-size:11px;padding:3px 8px" onclick="deleteHistEntry('${h.id}');event.stopPropagation()">
                <i class="fas fa-trash-alt"></i>
              </button>
            </div>
          </div>
        </div>`).join('')+`</div>`:''}
      </div>`;
    });
  }

  // ── SEÇÃO 2: PETISCOS & MASTIGÁVEIS — agrupado por mês, recolhível ──
  html+=`<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--amber);margin:20px 0 8px"><i class="fas fa-bone"></i> Produção de Petiscos & Mastigáveis</div>`;
  if(!petHistory.length){
    html+=`<div class="empty"><i class="fas fa-bone"></i><p>Nenhuma produção de petiscos registrada ainda.</p></div>`;
  } else {
    // agrupar por mês, depois por data dentro do mês
    const byMonth={};
    petHistory.forEach(p=>{
      const mk=mesAnoKey(p.date);
      if(!byMonth[mk]) byMonth[mk]=[];
      byMonth[mk].push(p);
    });
    const monthKeys=Object.keys(byMonth).sort((a,b)=>b.localeCompare(a));
    monthKeys.forEach(mk=>{
      const itemsMes=byMonth[mk];
      const isOpen=state.openPetHistMonths[mk]!==undefined?state.openPetHistMonths[mk]:(mk===monthKeys[0]);
      const totalMes=itemsMes.reduce((a,p)=>a+(p.kg||0),0);

      // agrupar por data dentro do mês
      const byDate={};
      itemsMes.forEach(p=>{
        if(!byDate[p.date]) byDate[p.date]=[];
        byDate[p.date].push(p);
      });
      const dates=Object.keys(byDate).sort((a,b)=>b.localeCompare(a));

      html+=`<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden">
        <div onclick="togglePetHistMonth('${mk}')" style="display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;background:${isOpen?'#FEF5E7':'var(--card)'}">
          <div style="display:flex;align-items:center;gap:8px">
            <i class="fas fa-calendar-alt" style="color:var(--amber);font-size:13px"></i>
            <span style="font-weight:700;font-size:13px">${mesAnoLabel(dates[0])}</span>
            <span class="badge badge-gray" style="font-size:10px">${dates.length} dia${dates.length!==1?'s':''}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:12px;font-weight:700;color:var(--amber);font-family:'DM Mono',monospace">${totalMes.toFixed(2)} kg</span>
            <i class="fas fa-chevron-${isOpen?'up':'down'}" style="color:var(--amber);font-size:11px"></i>
          </div>
        </div>
        ${isOpen?`<div style="padding:6px 10px 10px">`+dates.map(date=>{
          const items=byDate[date];
          const totalDia=items.reduce((a,i)=>a+(i.kg||0),0);
          return `<div style="background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:6px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
              <span style="font-size:12px;font-weight:700">${fmtDate(date)}</span>
              <span style="font-size:12px;font-weight:700;color:var(--amber);font-family:'DM Mono',monospace">${totalDia.toFixed(2)} kg</span>
            </div>
            <button class="btn btn-sm btn-full" style="margin:2px 0 7px;border-color:#C0392B;color:#C0392B;font-size:11px;font-weight:700" onclick="gerarPDFpetiscos('${date}')"><i class="fas fa-file-pdf"></i>&nbsp; Gerar PDF de produção (rastreabilidade)</button>
            ${items.map(i=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-top:1px solid var(--border)">
              <span style="font-size:12px">${i.item}</span>
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-size:12px;font-weight:600;color:var(--text-2)">${i.kg}kg</span>
                <button class="btn btn-sm" style="font-size:10px;padding:2px 7px" onclick="editPetHistEntry('${i.id}')"><i class="fas fa-edit"></i></button>
                <button class="btn btn-sm btn-danger" style="font-size:10px;padding:2px 7px" onclick="deletePetHistEntry('${i.id}')"><i class="fas fa-trash-alt"></i></button>
              </div>
            </div>`).join('')}
          </div>`;
        }).join('')+`</div>`:''}
      </div>`;
    });
  }
  document.getElementById('content').innerHTML=html;
}

function toggleHistMonth(mk){
  state.openHistMonths[mk]=!(state.openHistMonths[mk]!==undefined?state.openHistMonths[mk]:true);
  renderHistorico();
}
function togglePetHistMonth(mk){
  state.openPetHistMonths[mk]=!(state.openPetHistMonths[mk]!==undefined?state.openPetHistMonths[mk]:true);
  renderHistorico();
}

function editPetHistEntry(id){
  const p=(state.db.petiscosHistory||[]).find(x=>x.id===id); if(!p) return;
  openModal(`<div class="modal-title">Editar Produção <button class="btn btn-sm" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Item</label><input type="text" value="${p.item}" disabled style="background:var(--bg);color:var(--text-3)"></div>
    <div class="row2">
      <div class="field"><label>Data</label><input type="date" id="eph-date" value="${p.date}"></div>
      <div class="field"><label>Peso (kg)</label><input type="number" min="0" step="0.01" id="eph-kg" value="${p.kg}"></div>

function saveEditPetHist(id){

    <div style="display:flex;gap:8px">
      <button class="btn btn-danger btn-full" onclick="confirmDeletePetHist('${id}')">Sim, excluir</button>
      <button class="btn btn-full" onclick="closeModal()">Cancelar</button>

function confirmDeletePetHist(id){

  saveData(); closeModal(); renderHistorico();
  toast('🗑 Registro excluído');

function cancelarEdicaoHist(){
  state.editingHistId=null;
  state.today={selected:{},date:todayStr()};
  if(!state.comTable) state.comTable={};
  if(!state.comFixed) state.comFixed={};
  state.comTable={};
  state.comFixed={};
  navigate('historico');
  toast('✅ Edição cancelada. Histórico preservado.',3000);
}

function editHistEntry(id){
  const h=(state.db.history||[]).find(x=>x.id===id); if(!h) return;

  // carrega a seleção salva de volta para o estado de hoje
  state.today.selected = JSON.parse(JSON.stringify(h.selected||{}));
  Object.keys(state.today.selected).forEach(rid=>{
    const r=state.db.recipes.find(x=>x.id===rid);
    if(r) state.today.selected[rid].recipe=r;
    else delete state.today.selected[rid];
  });
  state.today.date = h.date;

  // ── reconstruir comTable e comFixed a partir do histórico ──
  state.comTable = {};
  state.comFixed = {};

  Object.values(h.selected||{}).forEach(s=>{
    const r=s.recipe; if(!r||r.type!=='comercial'||r.barf) return;
    const rid=r.id;

    // pacotes fixos
    if(!state.comFixed[rid]) state.comFixed[rid]={p200:0,p500:0};
    state.comFixed[rid].p200 = s.p200||0;
    state.comFixed[rid].p500 = s.p500||0;

    // clientes personalizados → reconstruir linhas da tabela
    (s.customs||[]).forEach(c=>{
      // procurar se já existe linha para este cliente
      const existingKey=Object.keys(state.comTable).find(k=>state.comTable[k].name===c.name);
      const rowKey = existingKey || ('cr_hist_'+rid+'_'+c.name.replace(/\s/g,'_'));
      if(!state.comTable[rowKey]) state.comTable[rowKey]={name:c.name, bags:0, cells:{}};
      state.comTable[rowKey].cells[rid]={g:c.g, qty:c.qty};
      // extrair sacolas do nome se tiver "(X sacolas)"
      const bagMatch=c.name.match(/\((\d+) sacola/);
      if(bagMatch) state.comTable[rowKey].bags=parseInt(bagMatch[1]);
    });
  });

  state.editingHistId = id;
  closeModal();
  navigate('producao');
  toast('✏️ Produção carregada — tabela de cozidas preenchida. Ajuste e gere o PDF.',5000);
}

function fillComidaTemps(id){
  const h=(state.db.history||[]).find(x=>x.id===id); if(!h) return;
  const mp=computeMP(h.selected||{});
  const prot=mp.filter(e=>!e.raw && categorizaIngrediente(normalizeName(e.name))==='proteina');
  if(!prot.length){ toast('Sem proteínas cozidas pra monitorar nesse dia'); return; }
  if(!h.temps) h.temps={};
  const rows=prot.map(e=>{
    const fl=fifoLookup(e.name); const val=(h.temps[e.name]||'');
    const nm=e.name.replace(/'/g,"\\'");
    return `<div style="padding:8px 0;border-bottom:1px solid var(--border)">

      <input type="text" inputmode="decimal" placeholder="Temp. cozimento °C (mín. 74)" value="${(''+val).replace(/"/g,'&quot;')}" oninput="_setComidaTemp('${id}','${nm}',this.value)" style="width:100%">
    </div>`;
  }).join('');
  openModal(`<div class="modal-title">Temperaturas — ${h.dateStr||h.date} <button class="btn btn-sm" onclick="closeModal()">✕</button></div>
    <div style="font-size:12px;color:var(--text-2);margin-bottom:8px">A Renata registra a temperatura de cozimento de cada proteína (mín. 74 °C no centro). Marca e lote vêm automáticos do recebimento (FIFO). Legumes e pré-processados não precisam de medição.</div>

function _setComidaTemp(id,name,val){
  const h=(state.db.history||[]).find(x=>x.id===id); if(!h) return;

}

function regenarPDFHist(id){
  const h=(state.db.history||[]).find(x=>x.id===id); if(!h) return;
  // backup do estado atual
  const selBackup=JSON.parse(JSON.stringify(state.today.selected));
  const dateBackup=state.today.date;
  // carrega seleção do histórico com receitas ATUAIS do DB
  const sel=JSON.parse(JSON.stringify(h.selected||{}));
  Object.keys(sel).forEach(rid=>{
    const r=state.db.recipes.find(x=>x.id===rid);
    if(r) sel[rid].recipe=r; // usa sempre a receita atual
    else delete sel[rid];
  });
  state.today.selected=sel;
  state.today.date=h.date;
  window._comidaTemps=h.temps||{};
  // gera PDF sem salvar no histórico
  gerarRelatorioSemSalvar();
  window._comidaTemps=null;
  // restaura imediatamente (gerarRelatorioSemSalvar não reseta o estado)
  state.today.selected=selBackup;
  state.today.date=dateBackup;
}

function mpSugestoes(){
  const set=new Set();
  (state.db.recipes||[]).forEach(r=>(r.ingredients||[]).forEach(i=>{ try{ set.add(normalizeName(i.n)); }catch(e){ set.add(i.n); } }));
  Object.values(PETISCO_COMP).forEach(c=>(c.mp||[]).forEach(m=>{ if(String(m).toLowerCase().indexOf('vinagre')<0) set.add(m); }));
  (typeof CARNES_BASE!=='undefined'?CARNES_BASE:[]).forEach(c=>set.add(c));
  return [...set].filter(Boolean).sort((a,b)=>a.localeCompare(b,'pt'));
}
function setRecebEdit(f,val){ if(!state.recebEdit) state.recebEdit={}; state.recebEdit[f]=val; }
function recebFoto(input, idx){
  const f=input.files&&input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=ev=>{ const img=new Image(); img.onload=()=>{
    const max=1200; let w=img.width,h=img.height;
    if(w>max||h>max){ if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;} }
    const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
    const data=c.toDataURL('image/jpeg',0.6);
    if(!state.recebEdit) state.recebEdit={}; if(!state.recebEdit.fotos) state.recebEdit.fotos=[];
    state.recebEdit.fotos[idx]=data;
    const prev=document.getElementById('receb-foto-prev-'+idx); if(prev) prev.innerHTML='<img src="'+data+'" style="max-width:100%;border-radius:8px;margin-top:6px">';
  }; img.src=ev.target.result; };
  rd.readAsDataURL(f);
}

function _nk(s){ return (''+s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\(.*?\)/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function inventarioItens(){
  // Ingredientes secos: puxa do histórico de receitas, deduplicado e SEM nada de origem animal.
  const carneKeys=new Set(INV_CARNES.map(_nk));
  const secoW=['arroz','aveia','premix','quimtia','nutroplus','nutro plus','nutrally','food dog','sal','curcuma','cúrcuma','oleo','óleo','azeite','farinha','ricota','cottage','fibras','fósforo','fosforo','vinagre','banha','psyllium','linhaca','linhaça','chia','gergelim','colageno','colágeno'];
  const secos={};
  (state.db.recipes||[]).forEach(r=>(r.ingredients||[]).forEach(x=>{ let n; try{n=normalizeName(x.n);}catch(e){n=x.n;} const low=(''+n).toLowerCase(); const k=_nk(n);
    if(carneKeys.has(k)) return;
    let cat='vegetal'; try{cat=categorizaIngrediente(n);}catch(e){}
    if(cat==='proteina') return;
    if(secoW.some(w=>low.includes(w)) || cat==='suplemento'){ if(!secos[k]) secos[k]=n; }
  }));
  const vals=o=>Object.values(o).sort((a,b)=>(''+a).localeCompare(''+b,'pt'));
  return [
    {key:'carnes', label:'Carnes e produtos de origem animal', itens:INV_CARNES.slice().sort((a,b)=>a.localeCompare(b,'pt'))},
    {key:'secos', label:'Ingredientes secos (suplementos, grãos, temperos)', itens:vals(secos)},
    {key:'limpeza', label:'Produtos de limpeza', itens:INV_LIMPEZA},
    {key:'embalagens', label:'Embalagens', itens:INV_EMBALAGENS},
    {key:'etiquetas', label:'Etiquetas', itens:INV_ETIQUETAS}
  ];
}

function invFoto(input,grupo){
  const f=input.files&&input.files[0]; if(!f) return;
  const d=state.invDate||state.today.date;
  const rd=new FileReader();
  rd.onload=ev=>{ const img=new Image(); img.onload=()=>{
    const max=1200; let w=img.width,h=img.height;
    if(w>max||h>max){ if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;} }
    const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
    const data=c.toDataURL('image/jpeg',0.6);
    if(!state.db.inventario) state.db.inventario={}; if(!state.db.inventario[d]) state.db.inventario[d]={};
    if(!state.db.inventario[d].__fotos) state.db.inventario[d].__fotos={};
    if(!state.db.inventario[d].__fotos[grupo]) state.db.inventario[d].__fotos[grupo]=[];
    state.db.inventario[d].__fotos[grupo].push(data);
    render();
  }; img.src=ev.target.result; };
  rd.readAsDataURL(f);
}

function renderInventario(){
  if(!state.invDate) state.invDate=state.today.date;

function inventarioResumoHTML(){

    if(!itens.length && !fts.length) return;
    h+=`<div style="font-weight:700;font-size:12px;color:#d35400;margin:8px 0 3px">${g.label}</div>`;

  });
  return h;
}

function fmtD(s){ return (s||'').split('-').reverse().join('/'); }
function statusPeriod(lastStr, days){
  if(!lastStr) return {label:'Nunca registrado', bg:'#C0392B', fg:'#fff'};
  const last=new Date(lastStr+'T00:00:00');
  const now=new Date((state.today.date||todayStr())+'T00:00:00');
  const diff=Math.round((last.getTime()+days*86400000 - now.getTime())/86400000);
  if(diff<0) return {label:'VENCIDO há '+(-diff)+' dia(s)', bg:'#C0392B', fg:'#fff'};
  if(diff<=30) return {label:'Vence em '+diff+' dia(s)', bg:'#e0a93a', fg:'#fff'};
  return {label:'Em dia · próx. em '+diff+' dia(s)', bg:'#2e7d32', fg:'#fff'};
}

      const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);

function saveRT(key){
  const cfg=RT_MODULOS[key]; if(!cfg) return;
  const e=state.rtEdit||{vals:{},anexos:[]};
  const first=cfg.campos[0];
  if(first && !((e.vals[first.k]||'')+'').trim()){ toast('⚠️ Preencha: '+first.label); return; }
  if(!state.db.rt) state.db.rt={}; if(!state.db.rt[key]) state.db.rt[key]=[];
  state.db.rt[key].push({ id:'rt'+Date.now(), data:e.data||state.today.date, vals:e.vals||{}, anexos:e.anexos||[], responsavel:getResp()||'', savedAt:new Date().toLocaleString('pt-BR') });
  saveData(); toast('✅ Registro salvo'); state.rtEdit={vals:{},anexos:[]}; render();
}
function delRTentry(key,id){ if(!confirm('Apagar este registro?')) return; state.db.rt[key]=((state.db.rt||{})[key]||[]).filter(x=>x.id!==id); saveData(); render(); }

function renderRT(key){
  const cfg=RT_MODULOS[key]; if(!cfg) return renderFlaviaMenu();
  if(!state.rtEdit || state.rtEditKey!==key){ state.rtEdit={vals:{},anexos:[]}; state.rtEditKey=key; }
  const e=state.rtEdit;
  const lista=((state.db.rt||{})[key]||[]).slice().sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  let html=_voltar()+modoBanner(cfg.pop+' · '+cfg.titulo);
  if(cfg.periodo){ const st=statusPeriod(lista[0]&&lista[0].data, cfg.periodo);
    html+=`<div style="margin-bottom:10px"><span style="font-size:12px;font-weight:700;background:${st.bg};color:${st.fg};padding:5px 12px;border-radius:14px">${st.label}</span></div>`; }
  html+=`<div style="font-size:11px;color:var(--text-2);margin-bottom:10px"><b>${cfg.cod}</b> · ${cfg.per}. ${cfg.ajuda}</div>`;
  if(state.role==='lorian') html+=`<div style="margin:0 0 12px">`+botaoAssinar('rt_'+key,cfg.titulo)+assinaturaHTML('rt_'+key)+`</div>`;
  html+=`<div class="card"><div class="field" style="margin-bottom:8px"><label>Data</label><input type="date" value="${e.data||state.today.date}" oninput="setRTval('__data',this.value)"></div>`;
  cfg.campos.forEach(c=>{ const v=e.vals[c.k]||'';
    html+=`<div class="field" style="margin-bottom:8px"><label>${c.label}</label>`;
    if(c.type==='text') html+=`<input type="text" value="${_esc(v)}" oninput="setRTval('${c.k}',this.value)">`;
    else if(c.type==='number') html+=`<input type="text" inputmode="decimal" value="${_esc(v)}" oninput="setRTval('${c.k}',this.value)">`;
    else if(c.type==='date') html+=`<input type="date" value="${_esc(v)}" oninput="setRTval('${c.k}',this.value)">`;
    else if(c.type==='textarea') html+=`<textarea rows="2" oninput="setRTval('${c.k}',this.value)">${_esc(v)}</textarea>`;
    else if(c.type==='botoes') html+=`<div style="display:flex;flex-wrap:wrap;gap:6px">`+c.opts.map(o=>`<button class="btn btn-sm" style="${v===o?'background:var(--green-dark);color:#fff;border-color:var(--green-dark)':''}" onclick="setRTtap('${c.k}','${(''+o).replace(/'/g,"\\'")}')">${o}</button>`).join('')+`</div>`;
    html+=`</div>`;
  });
  html+=`<div class="field" style="margin-bottom:4px"><label>${cfg.anexo||'Anexos (opcional)'}</label>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <label class="btn btn-sm" style="cursor:pointer"><i class="fas fa-camera"></i>&nbsp;Câmera<input type="file" accept="image/*" capture="environment" style="display:none" onchange="anexoRT(this)"></label>
      <label class="btn btn-sm" style="cursor:pointer"><i class="fas fa-paperclip"></i>&nbsp;Arquivo<input type="file" accept="image/*,application/pdf" style="display:none" onchange="anexoRT(this)"></label>
    </div>`;
  html+=`<div style="margin-top:6px">`+(e.anexos||[]).map((a,i)=> a.t==='image'
      ? `<div style="display:inline-block;position:relative;margin:4px 4px 0 0"><img src="${a.d}" style="height:64px;border-radius:6px;display:block"><button class="btn btn-icon btn-sm btn-danger" style="position:absolute;top:-7px;right:-7px;padding:2px 6px" onclick="delRTanexo(${i})"><i class="fas fa-times"></i></button></div>`
      : `<div style="display:inline-flex;align-items:center;gap:6px;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:5px 9px;margin:4px 4px 0 0;font-size:12px"><i class="fas fa-file-pdf" style="color:#c0392b"></i>${a.n}<button class="btn btn-icon btn-sm btn-danger" style="padding:1px 6px" onclick="delRTanexo(${i})"><i class="fas fa-times"></i></button></div>`
    ).join('')+`</div></div>`;
  html+=`<button class="btn btn-primary btn-full" style="margin-top:8px" onclick="saveRT('${key}')"><i class="fas fa-save"></i> Salvar registro</button></div>`;
  html+=`<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-2);margin:16px 0 6px">Registros (${lista.length})</div>`;
  if(!lista.length) html+=`<div style="font-size:12px;color:var(--text-3)">Nenhum registro ainda.</div>`;
  html+=lista.map(r=>{
    const resumo=cfg.campos.slice(0,3).map(c=> r.vals[c.k]?('<b>'+c.label+':</b> '+_esc(r.vals[c.k])):'').filter(Boolean).join(' · ');
    const ax=(r.anexos||[]).map(a=> a.t==='image'
        ? `<a href="${a.d}" target="_blank"><img src="${a.d}" style="height:58px;border-radius:5px;margin:4px 4px 0 0"></a>`
        : `<a href="${a.d}" download="${a.n}" style="font-size:11px;display:inline-block;margin:4px 8px 0 0"><i class="fas fa-file-pdf" style="color:#c0392b"></i> ${a.n}</a>`).join('');
    return `<div class="pkt-section"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:12px;font-weight:700">${fmtD(r.data)}</div><button class="btn btn-icon btn-sm btn-danger" onclick="delRTentry('${key}','${r.id}')"><i class="fas fa-trash-alt"></i></button></div><div style="font-size:12px;color:var(--text-2);margin-top:3px">${resumo||'—'}</div>${ax?('<div>'+ax+'</div>'):''}</div>`;
  }).join('');
  document.getElementById('content').innerHTML=html;
}

      if(!keys.length) html+=_monEmpty('—');
      html+=keys.map(it=>`<div style="font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)"><b>${it}</b>: dias ${(items[it]||[]).join(', ')||'—'}</div>`).join('');
      html+=`</div>`;
    });
  }
  else if(which==='tempequip'){
    const te=state.db.tempEquip||{}; const dias=Object.keys(te).sort((a,b)=>b.localeCompare(a));
    if(!dias.length) html+=_monEmpty('Nenhuma temperatura lançada.');

    if(!arr.length) html+=_monEmpty('Nenhuma análise de água lançada.');
    html+=arr.map(r=>`<div class="pkt-section"><div style="font-weight:700;font-size:13px;color:#2471a3">${fmtD(r.data)}</div>

  }
  else if(which==='manutencao'){
    const arr=(state.db.manutencao||[]).slice().sort((a,b)=>(b.data||'').localeCompare(a.data||''));

  else if(which==='producao'){

    html+=`<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-2);margin:4px 0 6px">Carnes de sexta (cozimento)</div>`;
    if(!dias.length) html+=_monEmpty('Nenhum cozimento lançado.');
    dias.slice(0,6).forEach(d=>{ const rec=cs[d]||{}; const carnes=Object.keys(rec).filter(k=>rec[k]&&(rec[k].temp||rec[k].qtd));

      html+=`<div class="pkt-section"><div style="font-weight:700;font-size:13px;color:#2471a3">${fmtD(d)}</div>`+carnes.map(cn=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0"><span>${cn}</span><span style="font-weight:700">${rec[cn].temp?(_esc(rec[cn].temp)+'°C'):''}${rec[cn].qtd?(' · '+_esc(rec[cn].qtd)+' emb'):''}</span></div>`).join('')+`</div>`;
    });
    const hist=(state.db.history||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    html+=`<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-2);margin:12px 0 6px">Comidas (temperaturas)</div>`;
    const comHist=hist.filter(h=>h.temps&&Object.keys(h.temps).length);
    if(!comHist.length) html+=_monEmpty('Nenhuma temperatura de comida registrada.');
    comHist.slice(0,6).forEach(h=>{ html+=`<div class="pkt-section"><div style="font-weight:700;font-size:13px;color:#2471a3">${fmtD(h.date)}</div>`+Object.keys(h.temps).map(nm=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0"><span>${nm}</span><span style="font-weight:700">${_esc(h.temps[nm])}°C</span></div>`).join('')+`</div>`; });
  }
  document.getElementById('content').innerHTML=html;
}

/* ============================================================

function assinarRT(chave, rotulo){
  const por=getResp()||'Lorian (RT)';
  if(!state.db.assinaturas) state.db.assinaturas={};
  state.db.assinaturas[chave]={por:por, data:state.today.date, rotulo:rotulo||chave, ts:new Date().toLocaleString('pt-BR')};
  saveData(); toast('✅ Assinado como RT'); render();
}
function tirarAssinatura(chave){ if(state.db.assinaturas) delete state.db.assinaturas[chave]; saveData(); toast('Assinatura removida'); render(); }
function assinaturaHTML(chave){

function _fiscalStat(stat){
  const db=state.db||{};
  const arrLast=a=>{ a=a||[]; const ds=a.map(x=>x.data).filter(Boolean).sort(); return {count:a.length, last:ds[ds.length-1]||''}; };
  if(stat.indexOf('rt:')===0) return arrLast((db.rt||{})[stat.slice(3)]);
  if(stat==='recebimentos') return arrLast(db.recebimentos);
  if(stat==='agua') return arrLast(db.agua);
  if(stat==='conduta') return arrLast(db.conduta);
  if(stat==='manutencao') return arrLast(db.manutencao);
  if(stat==='pragas') return arrLast(db.pragas);
  if(stat==='hig'){ const m=Object.keys(db.higienizacao||{}).sort(); return {count:m.length, last:m[m.length-1]||''}; }
  if(stat==='temp'){ const d=Object.keys(db.tempEquip||{}).sort(); return {count:d.length, last:d[d.length-1]||''}; }
  if(stat==='prod'){ const h=(db.history||[]).filter(x=>x.temps&&Object.keys(x.temps).length); const ds=h.map(x=>x.date).filter(Boolean).sort(); return {count:h.length, last:ds[ds.length-1]||''}; }
  return {count:0,last:''};
}

function savePetiscoSel(){
  const sel=state.petiscoSel||{}; const item=sel.item, category=sel.category; if(!item) return;
  const comp=PETISCO_COMP[item]||petiscoInfo(item,category);
  const e=state.petiscoEdit||{};
  const date=e.date||state.today.date;
  const emb=parseInt(e.emb)||0;
  const pesoEmb=parseFloat(String(e.pesoEmb||comp.pesoEmb||'').toString().replace(',','.'))||0;
  if(!emb||emb<=0||!pesoEmb||pesoEmb<=0){ toast('⚠️ Informe nº de embalagens e gramatura (o que saiu)'); return; }
  const kg=+(emb*pesoEmb/1000).toFixed(3);
  const mpCruaKg=parseFloat(String(e.mpCruaKg||'').toString().replace(',','.'))||0;
  if(!state.db.petiscosHistory) state.db.petiscosHistory=[];
  state.db.petiscosHistory=state.db.petiscosHistory.filter(p=>!(p.item===item&&p.date===date));
  state.db.petiscosHistory.push({ id:'p'+Date.now()+Math.random().toString(36).slice(2,6),
    category, item, date, emb, pesoEmb, kg, mpCruaKg,
    entrada:e.entrada||'', saida:e.saida||'', tempEnt:e.tempEnt||'', tempSai:e.tempSai||'', aw:e.aw||'',
    responsavel:getResp()||'', savedAt:new Date().toLocaleString('pt-BR') });

      const list=prods.filter(p=>(PETISCO_COMP[p.item]||petiscoInfo(p.item,p.category)).grupo===g);

        const done=(state.db.petiscosHistory||[]).some(h=>h.item===p.item&&h.date===today);

  html+=`<button class="btn btn-sm" style="margin-bottom:10px" onclick="backPetisco()"><i class="fas fa-arrow-left"></i> Voltar à lista</button>`;
  html+=`<div class="card">
    <div class="pkt-name" style="margin:0 0 4px">${item}</div>
    <div style="font-size:11px;color:var(--text-2);margin-bottom:10px"><b>Matéria-prima:</b> ${(comp.mp&&comp.mp.join(' + '))||item} &nbsp;·&nbsp; Marca/Lote: automático (FIFO)</div>
    <div class="row2">
      <div class="field" style="margin-bottom:0"><label>Data</label><input type="date" value="${v('date')||state.today.date}" oninput="setPetEdit('date',this.value)"></div>
      <div class="field" style="margin-bottom:0"><label>MP crua usada (kg)</label><input type="text" inputmode="decimal" placeholder="Ex: 10" value="${v('mpCruaKg')}" oninput="setPetEdit('mpCruaKg',this.value)"></div>
    </div>
    <div class="row2" style="margin-top:8px">
      <div class="field" style="margin-bottom:0"><label>Nº embalagens (saíram)</label><input type="number" min="0" step="1" placeholder="Ex: 30" value="${v('emb')}" oninput="setPetEdit('emb',this.value)"></div>
      <div class="field" style="margin-bottom:0"><label>Gramatura (${unid})</label><input type="number" min="0" step="1" placeholder="${comp.pesoEmb||'Ex: 100'}" value="${v('pesoEmb')||comp.pesoEmb||''}" oninput="setPetEdit('pesoEmb',this.value)"></div>
    </div>
    <div class="row2" style="margin-top:8px">
      <div class="field" style="margin-bottom:0"><label>Entrada (hora)</label><input type="time" value="${v('entrada')}" oninput="setPetEdit('entrada',this.value)"></div>
      <div class="field" style="margin-bottom:0"><label>Saída (hora)</label><input type="time" value="${v('saida')}" oninput="setPetEdit('saida',this.value)"></div>
    </div>
    <div class="row2" style="margin-top:8px">
      <div class="field" style="margin-bottom:0"><label>Temp. entrada (°C)</label><input type="text" inputmode="decimal" placeholder="Ex: 65" value="${v('tempEnt')}" oninput="setPetEdit('tempEnt',this.value)"></div>
      <div class="field" style="margin-bottom:0"><label>Temp. saída (°C)</label><input type="text" inputmode="decimal" placeholder="Ex: 70" value="${v('tempSai')}" oninput="setPetEdit('tempSai',this.value)"></div>
    </div>

  </div>`;
  document.getElementById('content').innerHTML=html;
}

function setPetiscosTab(tab){
  state.petiscosTab=tab;
  renderPetiscos();
}

function setPetiscoField(tab, idx, field, val){
  if(!state.petiscosToday) state.petiscosToday={};
  if(!state.petiscosToday[tab]) state.petiscosToday[tab]={};
  if(!state.petiscosToday[tab][idx]) state.petiscosToday[tab][idx]={};
  if(field==='emb') val=parseInt(val)||0;
  state.petiscosToday[tab][idx][field]=val;
}

function savePetiscoEntry(tab, idx){
  const item=state.db.petiscosItems[tab][idx];
  if(!item){ toast('⚠️ Nenhum item'); return; }
  const comp=PETISCO_COMP[item]||petiscoInfo(item,tab);
  const t=state.petiscosToday?.[tab]?.[idx]||{};
  const saved=(state.db.petiscosHistory||[]).find(p=>p.item===item&&p.category===tab&&p.date===(t.date||state.today.date))||{};
  const g=k=> (t[k]!==undefined?t[k]:(saved[k]!==undefined?saved[k]:''));
  const date=g('date')||state.today.date;
  const emb=parseInt(g('emb'))||0;
  const pesoEmb=parseFloat(String(g('pesoEmb')||comp.pesoEmb||'').toString().replace(',','.'))||0;
  if(!emb||emb<=0||!pesoEmb||pesoEmb<=0){ toast('⚠️ Informe nº de embalagens e gramatura (o que saiu)'); return; }
  const kg=+(emb*pesoEmb/1000).toFixed(3);
  const mpCruaKg=parseFloat(String(g('mpCruaKg')||'').toString().replace(',','.'))||0;
  if(!state.db.petiscosHistory) state.db.petiscosHistory=[];
  state.db.petiscosHistory=state.db.petiscosHistory.filter(p=>!(p.item===item&&p.date===date&&p.category===tab));
  state.db.petiscosHistory.push({
    id:'p'+Date.now()+Math.random().toString(36).slice(2,6),
    category:tab, item, date, emb, pesoEmb, kg, mpCruaKg,
    entrada:g('entrada')||'', saida:g('saida')||'',
    tempEnt:g('tempEnt')||'', tempSai:g('tempSai')||'', aw:g('aw')||'',
    responsavel:getResp()||'', savedAt:new Date().toLocaleString('pt-BR')
  });
  saveData();
  toast(`✅ ${item} registrado (${date.split('-').reverse().join('/')})`);
  if(state.petiscosToday?.[tab]) delete state.petiscosToday[tab][idx];
  renderPetiscos();
}

function addPetiscoItem(tab){
  const name=document.getElementById('new-petisco-name')?.value.trim();
  if(!name){toast('⚠️ Informe o nome do item');return;}
  if(!state.db.petiscosItems[tab]) state.db.petiscosItems[tab]=[];
  if(state.db.petiscosItems[tab].includes(name)){toast('⚠️ Item já cadastrado');return;}
  state.db.petiscosItems[tab].push(name);
  saveData(); renderPetiscos();
  toast(`✅ "${name}" adicionado!`);
}

function editPetiscoItem(tab, idx){
  const item=state.db.petiscosItems[tab][idx];
  const tabLabel=PETISCO_TABS.find(t=>t.key===tab)?.label||tab;
  openModal(`<div class="modal-title">Editar item — ${tabLabel} <button class="btn btn-sm" onclick="closeModal()">✕</button></div>
    <div class="field">
      <label>Nome do item</label>
      <input type="text" id="edit-petisco-name" value="${item}" style="font-size:14px">
    </div>
    <button class="btn btn-primary btn-full" onclick="saveEditPetiscoItem('${tab}',${idx})">
      <i class="fas fa-save"></i> Salvar
    </button>`);
  setTimeout(()=>document.getElementById('edit-petisco-name')?.focus(),100);
}

function saveEditPetiscoItem(tab, idx){
  const newName=document.getElementById('edit-petisco-name')?.value.trim();
  if(!newName){toast('⚠️ Informe o nome do item');return;}
  const oldName=state.db.petiscosItems[tab][idx];
  state.db.petiscosItems[tab][idx]=newName;
  // atualizar também o histórico de produções que usava o nome antigo
  (state.db.petiscosHistory||[]).forEach(p=>{
    if(p.item===oldName&&p.category===tab) p.item=newName;
  });
  saveData(); closeModal(); renderPetiscos();
  toast(`✅ "${newName}" atualizado!`);
}

function deletePetiscoItem(tab, idx){
  const item=state.db.petiscosItems[tab][idx];
  openModal(`<div class="modal-title">Excluir item?</div>
    <p style="font-size:13px;color:var(--text-2);margin-bottom:20px">Remover <strong>"${item}"</strong> da lista de ${PETISCO_TABS.find(t=>t.key===tab).label}? O histórico de produções já salvas não será afetado.</p>
    <div style="display:flex;gap:8px">
      <button class="btn btn-danger btn-full" onclick="confirmDeletePetiscoItem('${tab}',${idx})">Sim, excluir</button>
      <button class="btn btn-full" onclick="closeModal()">Cancelar</button>
    </div>`);
}

function confirmDeletePetiscoItem(tab, idx){
  state.db.petiscosItems[tab].splice(idx,1);
  saveData(); closeModal(); renderPetiscos();
  toast('🗑 Item excluído');
}

// composição qualitativa (dos CROQs) — editável conforme os CROQs do Drive
const PETISCO_COMP={
  'Petisco de Frango':{grupo:'petisco',mp:['Filé de frango'],unid:'g',pesoEmb:100},
  'Petisco de Boi':{grupo:'petisco',mp:['Lagarto bovino desidratado (subst.: patinho bovino)'],unid:'g',pesoEmb:200},

  'Caldo de Boi':{grupo:'caldo',mp:['Mocotó bovino','Vinagre de maçã'],unid:'ml',pesoEmb:300},
  'Caldo de Frango':{grupo:'caldo',mp:['Pé de frango','Vinagre de maçã'],unid:'ml',pesoEmb:300},
  'Caldo de Porco':{grupo:'caldo',mp:['Mocotó suíno','Vinagre de maçã'],unid:'ml',pesoEmb:300},
  'Caldo de Pato':{grupo:'caldo',mp:['Pé de pato','Vinagre de maçã'],unid:'ml',pesoEmb:300}
};
// Desidratados rendem ~30% -> matéria-prima crua = produzido / rendimento
const PETISCO_YIELD=0.30;
function petiscoInfo(nome, category){
  if(!nome) return {grupo:'petisco',mp:[],unid:'g',pesoEmb:0};
  if(PETISCO_COMP[nome]) return PETISCO_COMP[nome];
  const g={petiscos:'petisco',caldos:'caldo',saborizantes:'saborizante',nutrally:'mastigavel'}[category]||'petisco';
  let mp;
  if(g==='caldo') mp=['Ossos ('+nome.replace(/^Caldo\s*(de\s*)?(ossos?\s*(de\s*)?)?/i,'').trim()+')','Vinagre de maçã'];
  else mp=[nome.replace(/^(Petisco|Saborizante)\s*(de\s*|Peito de\s*)?/i,'').trim()||nome];
  return {grupo:g,mp,unid:g==='caldo'?'ml':'g',pesoEmb:g==='caldo'?300:0};
}

// cabeçalho verde (igual ao relatório de comidas)

  doc.text('Pág. '+doc.internal.getNumberOfPages(),200,10,{align:'right'});

}
function _secTitle(doc,y,title,color){
  doc.setFillColor(...(color||[181,205,90]));
  doc.rect(10,y,190,6,'F');
  doc.setTextColor(26,29,35); doc.setFontSize(8); doc.setFont('helvetica','bold');
  doc.text(title,12,y+4.2);

}
// última página — rastreabilidade (vermelho), pra Renata preencher
function _rastreabilidadePage(doc,produtos,dateFab,lote){
  doc.addPage(); _pdfHead(doc,'Rastreabilidade','',dateFab,lote);
  let y=29;
  y=_secTitle(doc,y,'RASTREABILIDADE E CONTROLE DE PROCESSO (PREENCHIDO NO APP)',[192,57,43]);
  const GRP_FILL={petisco:[238,244,208],mastigavel:[232,240,254],saborizante:[232,245,233],caldo:[254,235,200]};
  const body=[];
  (produtos||[]).forEach(p=>{
    const fill=GRP_FILL[p.grupo]||[240,240,240];
    const titulo=p.produto+(p.grupo==='caldo'?'   (ingredientes do mesmo produto — um só processo)':'');
    body.push([{content:titulo,colSpan:8,styles:{fillColor:fill,fontStyle:'bold',textColor:[26,29,35],halign:'left'}}]);
    const mps=(p.mp&&p.mp.length)?p.mp:[p.produto];
    const isMast=p.grupo==='mastigavel';
    const aw=isMast?(p.aw||''):'—';
    const ent=p.entrada||'', sai=p.saida||'', te=p.tempEnt||'', ts=p.tempSai||'';
    if(mps.length>1){
      mps.forEach((m,i)=>{
        const fl=fifoLookup(m);
        if(i===0){
          body.push([m,fl.marca,fl.lote,
            {content:ent,rowSpan:mps.length},{content:sai,rowSpan:mps.length},
            {content:te,rowSpan:mps.length},{content:ts,rowSpan:mps.length},
            {content:aw,rowSpan:mps.length,styles:{halign:'center'}}]);
        } else { body.push([m,fl.marca,fl.lote]); }
      });
    } else {
      const m=mps[0]; const fl=fifoLookup(m);
      body.push([m,fl.marca,fl.lote,ent,sai,te,ts,{content:aw,styles:{halign:'center'}}]);
    }
  });
  doc.autoTable({startY:y,
    head:[['Matéria-prima','Marca','Lote do fornecedor','Entrada (h)','Saída (h)','Temp. ent. °C','Temp. saí. °C','Aw']],
    body,
    styles:{fontSize:7,cellPadding:2,minCellHeight:9,textColor:[26,29,35],lineColor:[150,150,150],lineWidth:0.1,valign:'middle'},
    headStyles:{fillColor:[253,220,215],textColor:[26,29,35],fontStyle:'bold',fontSize:6.6,halign:'center'},
    columnStyles:{0:{cellWidth:40},1:{cellWidth:24},2:{cellWidth:28},3:{cellWidth:16},4:{cellWidth:16},5:{cellWidth:18},6:{cellWidth:18},7:{cellWidth:14,halign:'center'}},
    margin:{left:10,right:10}
  });
  let yy=doc.lastAutoTable.finalY+6;
  if(yy>275){ doc.addPage(); yy=20; }
  doc.setFontSize(7); doc.setFont('helvetica','bold'); doc.setTextColor(192,57,43);
  doc.text('Marca e Lote do fornecedor: automáticos por FIFO (PEPS) a partir do recebimento. Demais campos preenchidos no app.',10,yy); yy+=5;
  doc.setTextColor(26,29,35); doc.setFont('helvetica','normal'); doc.setFontSize(6.6);
  const notas=['Desidratados (petiscos, mastigáveis, saborizantes): horário de entrada/saída e temperatura de entrada/saída do desidratador.','Atividade de água (Aw): apenas nos mastigáveis — alvo ate 0,65.','Caldos: cocção prolongada com vinagre de maçã — os dois ingredientes são do mesmo produto (um só horário e temperatura).'];
  notas.forEach(n=>{ const ls=doc.splitTextToSize('• '+n,190); doc.text(ls,10,yy); yy+=ls.length*3.2; });
  yy+=6;
  doc.line(10,yy,86,yy); doc.line(120,yy,200,yy); yy+=4;
  doc.setFontSize(6.5);
  doc.text('Responsável pelo preenchimento',10,yy);
  doc.text('Validação do Responsável Técnico',120,yy);
}

// ── PDF 2: PETISCOS / MASTIGÁVEIS / SABORIZANTES / CALDOS (um grupo só) ──
function gerarPDFpetiscos(date){
  const d=date||state.today.date;
  const items=(state.db.petiscosHistory||[]).filter(p=>p.date===d);
  if(!items.length){ toast('⚠️ Nenhuma produção de petiscos salva nesse dia'); return; }
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const [yy,mm,dd]=(d||'').split('-'); const lote=`${yy||''}${mm||''}${dd||''}`;
  const dateStr=fmtDate(d), dateFab=fmtDateShort(d);
  _pdfHead(doc,'Produção de Petiscos & Mastigáveis',dateStr,dateFab,lote);
  let y=29;
  const grupos={}; const mpSet=new Set();
  items.forEach(p=>{
    const info=petiscoInfo(p.item,p.category);
    (grupos[info.grupo]=grupos[info.grupo]||[]).push(Object.assign({},p,{info}));
    info.mp.forEach(m=>mpSet.add(m));
  });
  ['petisco','mastigavel','saborizante','caldo'].forEach(g=>{
    if(!grupos[g]) return;
    if(y>250){ doc.addPage(); _pdfHead(doc,'Produção de Petiscos & Mastigáveis',dateStr,dateFab,lote); y=29; }
    y=_secTitle(doc,y,PETISCO_GRUPO_LABEL[g].toUpperCase());
    const body=grupos[g].map(p=>{
      const info=p.info, kg=p.kg||0;
      const pe=(p.pesoEmb&&p.pesoEmb>0)?p.pesoEmb:info.pesoEmb;
      const emb=(p.emb&&p.emb>0)?p.emb:(pe?Math.round(kg*1000/pe):'—');
      const mpKg=(p.mpKg&&p.mpKg>0)?(Number(p.mpKg).toFixed(2)+' kg'):(kg>0?(kg/PETISCO_YIELD).toFixed(2)+' kg':'—');
      return [p.item, info.mp.join(' + '), (p.mpCruaKg&&p.mpCruaKg>0?Number(p.mpCruaKg).toFixed(2)+' kg':'—'), String(emb), pe?(pe+(info.unid||'g')):'—', kg.toFixed(2)+' kg'];
    });
    doc.autoTable({startY:y,
      head:[['Produto','Matéria-prima','MP crua (kg)','Nº emb.','Gramatura','Produto acabado']],
      body,
      styles:{fontSize:8.5,cellPadding:2,textColor:[26,29,35],lineColor:[150,150,150],lineWidth:0.1},
      headStyles:{fillColor:[181,205,90],textColor:[26,29,35],fontStyle:'bold'},
      columnStyles:{0:{cellWidth:40},1:{cellWidth:50},2:{cellWidth:18},3:{cellWidth:18},4:{cellWidth:28},5:{cellWidth:26}},
      margin:{left:10,right:10}
    });
    y=doc.lastAutoTable.finalY+6;
  });
  const prodList=[];
  ['petisco','mastigavel','saborizante','caldo'].forEach(g=>{ (grupos[g]||[]).forEach(p=>prodList.push({produto:p.item,grupo:g,mp:(p.info&&p.info.mp)||[],entrada:p.entrada,saida:p.saida,tempEnt:p.tempEnt,tempSai:p.tempSai,aw:p.aw})); });
  _rastreabilidadePage(doc,prodList,dateFab,lote);
  doc.save(`petnaturau-petiscos-${(dateFab||'').replace(/\//g,'-')}.pdf`);
  toast('📄 PDF de petiscos gerado!');
}

    </div>`;
  }).join('');
}
function setCarneField(carne,field,val){
  const d=state.carnesDate||state.today.date;
  if(!state.db.carnesSexta) state.db.carnesSexta={};
  if(!state.db.carnesSexta[d]) state.db.carnesSexta[d]={};
  if(!state.db.carnesSexta[d][carne]) state.db.carnesSexta[d][carne]={};
  state.db.carnesSexta[d][carne][field]=val;
}
function setCarnesDate(v){ state.carnesDate=v; render(); }
function saveCarnesSexta(){
  const d=state.carnesDate||state.today.date;
  const m=(state.db.carnesSexta&&state.db.carnesSexta[d])||{};
  Object.keys(m).forEach(c=>{ const r=m[c]||{}; if(!r.temp&&!r.qtd&&!r.obs) delete m[c]; });
  saveData(); toast('✅ Carnes de sexta salvas ('+((d||'').split('-').reverse().join('/'))+')');
}

function mesExtenso(m){
  return ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][m-1].toUpperCase();
}

function gerarRelatorioPeriodo(){
  const de=document.getElementById('rel-de')?.value||state.relPeriodo.de;
  const ate=document.getElementById('rel-ate')?.value||state.relPeriodo.ate;
  if(!de||!ate){toast('⚠️ Selecione o período');return;}
  if(de>ate){toast('⚠️ Data inicial deve ser anterior à final');return;}

  const history=(state.db.history||[]).filter(h=>h.date>=de&&h.date<=ate);
  let petHistory=(state.db.petiscosHistory||[]).filter(p=>p.date>=de&&p.date<=ate);
  if(!history.length && !petHistory.length){toast('⚠️ Nenhuma produção encontrada nesse período');return;}

  // ── unifica variantes de maiúscula/minúscula do mesmo item (ex: "Pescoço de Pato" = "Pescoço de pato") ──
  const upperCount=s=>(s.match(/[A-ZÀ-ÞÁÉÍÓÚÂÊÔÃÕÇ]/g)||[]).length;
  const variants={};
  petHistory.forEach(p=>{const k=p.item.toLowerCase(); (variants[k]=variants[k]||{})[p.item]=(variants[k][p.item]||0)+1;});
  const canon={};
  Object.entries(variants).forEach(([k,vs])=>{
    canon[k]=Object.entries(vs).sort((a,b)=> b[1]-a[1] || upperCount(a[0])-upperCount(b[0]) || a[0].localeCompare(b[0],'pt'))[0][0];
  });
  petHistory=petHistory.map(p=>({...p,item:canon[p.item.toLowerCase()]}));

  // ── REGRA DE CATEGORIZAÇÃO DO RELATÓRIO (definida pela RT) ──
  // Caldos -> Saborizantes  |  Pescoço de pato + Orelha suína -> Mastigável  |  Nutrally permanece Nutrally
  const catRelatorio=(item,cat)=>{
    const it=(item||'').toLowerCase().trim();
    if(it==='pescoço de pato'||it==='orelha suína'||it==='orelha suina') return 'mastigavel';
    if(cat==='caldos') return 'saborizantes';
    return cat;
  };
  petHistory=petHistory.map(p=>({...p,category:catRelatorio(p.item,p.category)}));

  const CATLABEL={petiscos:'Petiscos',saborizantes:'Saborizantes',mastigavel:'Mastigável',nutrally:'Nutrally'};
  const CATORDER={petiscos:0,saborizantes:1,mastigavel:2,nutrally:3};

  // resumo por produto
  const prodMap={};
  petHistory.forEach(p=>{ if(!prodMap[p.item]) prodMap[p.item]={cat:p.category,total:0}; prodMap[p.item].total+=p.kg; });
  const resumo=Object.entries(prodMap).map(([nome,v])=>({nome,cat:v.cat,total:v.total}))
    .sort((a,b)=> (CATORDER[a.cat]??9)-(CATORDER[b.cat]??9) || a.nome.localeCompare(b.nome,'pt'));

  const receitasTotal=history.reduce((a,h)=>a+parseFloat(h.totalKg||0),0);
  const catTotals={petiscos:0,saborizantes:0,mastigavel:0,nutrally:0};
  petHistory.forEach(p=>{ if(catTotals[p.category]!=null) catTotals[p.category]+=p.kg; });
  const totPet=Object.values(catTotals).reduce((a,v)=>a+v,0);
  const totalGeral=receitasTotal+totPet;

  // ── PDF (retrato) ──
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const PW=210, PH=297, L=14, R=196, W=R-L;
  const INK=[26,29,35], SEP=[218,222,205], ALT=[248,250,240];

  // cabeçalho
  doc.setFillColor(...COR_PERSONAL); doc.rect(0,0,PW,22,'F');
  doc.setTextColor(...INK); doc.setFontSize(16); doc.setFont('helvetica','bold');
  doc.text('Relatório de Produção PetNaturau', L, 13);
  const [dY,dM,dD]=de.split('-'), [aY,aM,aD]=ate.split('-');
  const periodoStr=`De ${parseInt(dD)} de ${mesExtenso(parseInt(dM))} de ${dY} até ${parseInt(aD)} de ${mesExtenso(parseInt(aM))} de ${aY}`;
  doc.setFontSize(9.5); doc.setFont('helvetica','normal');
  doc.text(periodoStr, L, 29);
  doc.text(`Emitido em: ${new Date().toLocaleDateString('pt-BR')}`, R, 29, {align:'right'});
  let y=37;

  const sectionTitle=(txt,sub)=>{
    doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(...INK);
    doc.text(txt, L, y); y+=sub?4.5:5.5;
    if(sub){ doc.setFontSize(8.5); doc.setFont('helvetica','normal'); doc.setTextColor(90,95,80); doc.text(sub,L,y); y+=3.5; doc.setTextColor(...INK); }
  };
  const subTitle=txt=>{ doc.setFontSize(9.5); doc.setFont('helvetica','bold'); doc.setTextColor(...INK); doc.text(txt,L,y); y+=4.5; };

  // ═══ 1 · RESUMO POR PRODUTO ═══
  sectionTitle('1 · RESUMO POR PRODUTO','Total produzido de cada item no período, agrupado por categoria.');
  const body1=[[
    {content:'Receitas (cozidas + cruas)',styles:{fontStyle:'bold',fillColor:COR_COMERCIAL_L}},
    {content:'Receitas',styles:{fillColor:COR_COMERCIAL_L}},
    {content:receitasTotal.toFixed(2),styles:{halign:'right',fontStyle:'bold',fillColor:COR_COMERCIAL_L}}
  ]];
  resumo.forEach(p=>body1.push([p.nome,(CATLABEL[p.cat]||p.cat),{content:p.total.toFixed(2),styles:{halign:'right'}}]));
  body1.push([
    {content:'TOTAL GERAL DO PERÍODO',colSpan:2,styles:{fontStyle:'bold',fillColor:COR_PERSONAL,textColor:INK}},
    {content:totalGeral.toFixed(2),styles:{halign:'right',fontStyle:'bold',fillColor:COR_PERSONAL,textColor:INK}}
  ]);
  doc.autoTable({
    startY:y, head:[['Produto','Categoria','Total (kg)']], body:body1, theme:'plain',
    styles:{fontSize:8.5,cellPadding:2.2,textColor:INK},
    headStyles:{fillColor:COR_PERSONAL_L,textColor:INK,fontStyle:'bold',lineColor:COR_PERSONAL,lineWidth:{bottom:0.4}},
    columnStyles:{0:{halign:'left'},1:{halign:'left',cellWidth:34},2:{halign:'right',cellWidth:26}},
    alternateRowStyles:{fillColor:ALT},
    margin:{left:L,right:L}
  });
  y=doc.lastAutoTable.finalY+9;

  // ═══ 2 · TOTAIS POR CATEGORIA ═══
  if(y>PH-70){doc.addPage(); y=18;}
  sectionTitle('2 · TOTAIS POR CATEGORIA');
  const cRow=(lbl,val,fill,bold)=>[
    {content:lbl,styles:Object.assign({halign:'left'},fill?{fillColor:fill}:{},bold?{fontStyle:'bold'}:{})},
    {content:val,styles:Object.assign({halign:'right'},fill?{fillColor:fill}:{},bold?{fontStyle:'bold'}:{})}
  ];
  const body2=[
    cRow('Receitas', receitasTotal.toFixed(2)+' kg', COR_COMERCIAL_L, false),
    cRow('Petiscos', catTotals.petiscos.toFixed(2)+' kg'),
    cRow('Saborizantes', catTotals.saborizantes.toFixed(2)+' kg'),
    cRow('Mastigável', catTotals.mastigavel.toFixed(2)+' kg'),
    cRow('Nutrally', catTotals.nutrally.toFixed(2)+' kg'),
    cRow('TOTAL PETISCOS & MASTIGÁVEIS', totPet.toFixed(2)+' kg', COR_PERSONAL_L, true),
    cRow('TOTAL GERAL', totalGeral.toFixed(2)+' kg', COR_PERSONAL, true)
  ];
  doc.autoTable({
    startY:y, head:[['Categoria','Total no período']], body:body2, theme:'plain',
    styles:{fontSize:9,cellPadding:2.6,textColor:INK},
    headStyles:{fillColor:COR_PERSONAL_L,textColor:INK,fontStyle:'bold',lineColor:COR_PERSONAL,lineWidth:{bottom:0.4}},
    columnStyles:{0:{halign:'left'},1:{halign:'right',cellWidth:55}},
    margin:{left:L,right:L}
  });
  y=doc.lastAutoTable.finalY+9;

  // ═══ 3 · DETALHAMENTO DIÁRIO ═══
  if(y>PH-55){doc.addPage(); y=18;}
  sectionTitle('3 · DETALHAMENTO DIÁRIO');

  // 3.1 receitas por dia (dois pares lado a lado)
  const rec=history.map(h=>({date:h.date,kg:parseFloat(h.totalKg||0)})).filter(r=>r.kg>0).sort((a,b)=>a.date.localeCompare(b.date));
  if(rec.length){
    subTitle('3.1 · Receitas por dia');
    const half=Math.ceil(rec.length/2), lC=rec.slice(0,half), rC=rec.slice(half), mx=Math.max(lC.length,rC.length);
    const body31=[];
    for(let i=0;i<mx;i++){
      const l=lC[i], r=rC[i];
      body31.push([
        l?fmtDateShort(l.date):'', l?{content:l.kg.toFixed(2),styles:{halign:'right'}}:'',
        r?fmtDateShort(r.date):'', r?{content:r.kg.toFixed(2),styles:{halign:'right'}}:''
      ]);
    }
    doc.autoTable({
      startY:y, head:[['Data','Receitas (kg)','Data','Receitas (kg)']], body:body31, theme:'plain',
      styles:{fontSize:8.5,cellPadding:2,textColor:INK},
      headStyles:{fillColor:COR_PERSONAL_L,textColor:INK,fontStyle:'bold',lineColor:COR_PERSONAL,lineWidth:{bottom:0.4}},
      columnStyles:{0:{cellWidth:W*0.24},1:{halign:'right',cellWidth:W*0.26},2:{cellWidth:W*0.24},3:{halign:'right',cellWidth:W*0.26}},
      alternateRowStyles:{fillColor:ALT},
      margin:{left:L,right:L}
    });
    y=doc.lastAutoTable.finalY+8;
  }

  // 3.2 petiscos e mastigáveis por dia (lista)
  if(petHistory.length){
    if(y>PH-40){doc.addPage(); y=18;}
    subTitle('3.2 · Petiscos e mastigáveis por dia');
    const pl=petHistory.map(p=>({date:p.date,item:p.item,cat:p.category,kg:p.kg}))
      .sort((a,b)=>a.date.localeCompare(b.date)||a.item.localeCompare(b.item,'pt'));
    let prev=null;
    const body32=pl.map(p=>{
      const ds=p.date!==prev?fmtDateShort(p.date):''; prev=p.date;
      return [ ds?{content:ds,styles:{fontStyle:'bold'}}:'', p.item, (CATLABEL[p.cat]||p.cat), {content:p.kg.toFixed(2),styles:{halign:'right'}} ];
    });
    doc.autoTable({
      startY:y, head:[['Data','Produto','Categoria','kg']], body:body32, theme:'plain',
      styles:{fontSize:8.5,cellPadding:2,textColor:INK},
      headStyles:{fillColor:COR_PERSONAL_L,textColor:INK,fontStyle:'bold',lineColor:COR_PERSONAL,lineWidth:{bottom:0.4}},
      columnStyles:{0:{cellWidth:W*0.16},1:{cellWidth:W*0.50},2:{cellWidth:W*0.20},3:{halign:'right',cellWidth:W*0.14}},
      alternateRowStyles:{fillColor:ALT},
      margin:{left:L,right:L}
    });
    y=doc.lastAutoTable.finalY+10;
  }

  // assinatura
  if(y>PH-24){doc.addPage(); y=22;}
  doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...INK);
  doc.text('Responsável técnico: ____________________________________', L, y);
  doc.text('Data de emissão: _____ / _____ / _______', 128, y);
  y+=8;
  doc.setFontSize(7); doc.setTextColor(120,120,120);
  doc.text('PetNaturau — Controle de Produção e Rastreabilidade — RE002/POP5-POP9', L, y);
  doc.setTextColor(...INK);

  // rodapé com número de página (todas as páginas)
  const nP=doc.internal.getNumberOfPages();
  for(let i=1;i<=nP;i++){
    doc.setPage(i);
    doc.setFontSize(7); doc.setTextColor(150,150,150);
    doc.text(`Página ${i}`, PW-14, PH-8, {align:'right'});
    doc.setTextColor(...INK);
  }

  const deShort=fmtDateShort(de).replace(/\//g,'-');
  const ateShort=fmtDateShort(ate).replace(/\//g,'-');
  doc.save(`relatorio-producao-${deShort}_a_${ateShort}.pdf`);
  toast('📄 Relatório gerado com sucesso!');
}

// ── INIT ──────────────────────────────────────────────────
state.role = getModo();
state.page = (state.role==='renata'||state.role==='lorian'||state.role==='fiscal') ? 'menu' : 'producao';
const gotToken = checkAuthCallback();
if (gotToken) {
  loadData();
} else {
  const raw = localStorage.getItem('petnaturau-db');
  if (raw) {
    state.driveToken = 'local';
    document.getElementById('auth-btn').className = 'auth-btn connected';
    document.getElementById('auth-label').textContent = 'Local ✓';
    state.db = JSON.parse(raw);
    ensureDbShape();
    render();
  } else {
    render(); // mostra tela de boas-vindas
  }
}
